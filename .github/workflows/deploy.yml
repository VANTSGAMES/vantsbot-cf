name: vantsbot · tests y deploy Cloudflare Worker
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vantsbot-deploy
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxis y tests locales
        run: |
          node --check src/index.js
          node --check src/banterHub.js
          node --check src/bus.js
          node test_local.mjs
          node test_banter_hub.mjs
      - name: Deploy Worker vantsbot a Cloudflare (solo main con CLOUDFLARE_API_TOKEN)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8f2424e95fec4860e19257226f209fbc
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Configura el secret CLOUDFLARE_API_TOKEN en VANTSGAMES/vantsbot-cf para habilitar auto-deploy."
            exit 0
          fi
          npx -y wrangler@4 deploy
          sleep 5
          curl -fsS -A "Mozilla/5.0 (compatible; VANTSHealthCheck/1.0; +https://vants.cc)" https://bot.vants.cc/banter/estado
          curl -fsS -A "Mozilla/5.0 (compatible; VANTSHealthCheck/1.0; +https://vants.cc)" https://bot.vants.cc/salud
